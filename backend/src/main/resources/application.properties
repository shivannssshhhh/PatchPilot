server.port=${SERVER_PORT:8000}
spring.application.name=patchpilot-backend
spring.datasource.url=${PATCHPILOT_DB_URL:jdbc:sqlite:./patchpilot.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
patchpilot.pipeline.delay-ms=${PATCHPILOT_PIPELINE_DELAY_MS:350}
patchpilot.sample-app.path=${PATCHPILOT_SAMPLE_APP_PATH:../sample_app}
patchpilot.sandbox.mode=${SANDBOX_MODE:auto}
patchpilot.sandbox.python-executable=${PATCHPILOT_PYTHON:python}
patchpilot.sandbox.timeout-seconds=${PATCHPILOT_SANDBOX_TIMEOUT_SECONDS:30}
